[package]
name = "dailp-graphql"
version = "0.2.1"
authors = ["Shelby Snead <taylor@snead.xyz>"]
edition = "2021"

[lib]
name = "dailp_graphql"
path = "src/lib.rs"

[[bin]]
name = "dailp-graphql"
path = "src/lambda.rs"

[[bin]]
name = "dailp-outbound"
path = "src/outbound_lambda.rs"


[[bin]]
name = "dailp-graphql-local"
path = "src/server.rs"

[[bin]]
name = "dailp-graphql-schema"
path = "src/generate-schema.rs"

[dependencies]
serde_json = "1.0"
tokio = { version = "1.20", features = ["full", "time"] }
anyhow = "1"
futures = "0.3"
lambda_http = "0.5"
dotenv = "0.15"
lazy_static = "1.4"
itertools = "0.10"
async_once = "0.2"
base64 = "0.13"
serde = "1"
serde_with = "1.9"
serde_plain = "0.3"
async-trait = "*"
log = "0.4"
pretty_env_logger = "0.4"
# Used for running a local server.
async-graphql-tide = "4"
tide = "0.16"
async-std = { version = "1", features = ["attributes", "tokio1"] }
jsonwebtoken = "8"
aws-config = "1.1.7"
# TODO this is a very old version; using this to resolve comptability
# conflicts between the Rust toolchain version, our current Rust edition,
# this dependency, and several other dependencies. We'll want to
# do work to ensure our dependencies are reasonably up-to-date but that's
# not the issue I'm solving at this moment.
aws-sdk-lambda = "1.3.0"
# Presigning backup download URLs (service_integrations/backups.rs). aws-sigv4
# rather than aws-sdk-s3 on purpose: all three of these are already resolved in
# Cargo.lock as transitive dependencies, so they add nothing to the build
# closure, and signing at this level works for any operation -- which matters
# because the backup listing has to be presigned too, not just GetObject.
aws-sigv4 = "1"
aws-credential-types = "1"
percent-encoding = "2"

dailp = {path = "../types"}
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
