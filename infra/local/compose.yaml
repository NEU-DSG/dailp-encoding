services:
  postgres:
    image: postgres:14-bookworm
    environment:
      POSTGRES_USER: dailp
      POSTGRES_PASSWORD: dailp-pass
      POSTGRES_DB: dailp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailp -d dailp"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  rustfs:
    image: rustfs/rustfs:1.0.5
    env_file:
      - rustfs-admin.env
    environment:
      RUSTFS_REGION: us-east-1
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - --max-time
        - "2"
        - http://127.0.0.1:9000/health/ready
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  storage-init:
    image: rustfs/rustfs:1.0.5
    entrypoint: ["/bin/sh", "/bootstrap/setup-storage.sh"]
    environment:
      RC_CONFIG_DIR: /tmp/rc
    env_file:
      - rustfs-admin.env
      - storage.env
    depends_on:
      rustfs:
        condition: service_healthy
    volumes:
      - ./setup-storage.sh:/bootstrap/setup-storage.sh:ro
      - ./policies:/bootstrap/policies:ro

  cognito:
    image: jagregory/cognito-local:5.3.0
    environment:
      HOST: "0.0.0.0"
      PORT: "9229"
    ports:
      - "127.0.0.1:9229:9229"
    volumes:
      - cognito_data:/app/.cognito
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9229/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  cognito-init:
    image: amazon/aws-cli:2.27.41
    entrypoint: ["/bin/sh", "/bootstrap/setup-cognito.sh"]
    depends_on:
      cognito:
        condition: service_healthy
    volumes:
      - ./setup-cognito.sh:/bootstrap/setup-cognito.sh:ro
      - cognito_config:/run/cognito

  cognito-users:
    image: amazon/aws-cli:2.27.41
    profiles: ["tools"]
    entrypoint: ["/bin/bash", "/bootstrap/cognito-users.sh"]
    environment:
      DAILP_COGNITO_ENDPOINT: "http://cognito:9229"
    depends_on:
      cognito:
        condition: service_healthy
    volumes:
      - ./cognito-users.sh:/bootstrap/cognito-users.sh:ro

  graphql:
    build:
      context: ../..
      dockerfile: graphql/Dockerfile
      target: dev
    environment:
      TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
      TF_STAGE: "local"
      DAILP_COGNITO_JWKS_PATH: "/run/cognito/jwks.json"
      DAILP_COGNITO_SERVER_ENDPOINT: "http://cognito:9229"
      DAILP_COGNITO_ISSUER_BASE: "http://0.0.0.0:9229"
      DATABASE_URL: postgres://dailp:dailp-pass@postgres:5432/dailp
      SQLX_OFFLINE: "false"
      GRAPHQL_SERVER_ADDRESS: "0.0.0.0:8080"
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      cognito-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../..:/workspace
      - cargo_target:/workspace/target
      - cognito_config:/run/cognito:ro

  website:
    profiles: ["frontend"]
    build:
      context: ../..
      dockerfile: website/Dockerfile
      target: dev
    env_file: [storage.env]
    environment:
      TF_STAGE: "local"
      TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      DAILP_AWS_REGION: "us-east-1"
      DAILP_API_URL: "http://127.0.0.1:8080"
      DAILP_DEV_SERVER_HOST: "0.0.0.0"
      DAILP_COGNITO_ENDPOINT: "http://127.0.0.1:9229"
      DAILP_COGNITO_SERVER_ENDPOINT: "http://cognito:9229"
    depends_on:
      storage-init:
        condition: service_completed_successfully
      cognito-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${DAILP_WEB_PORT:-3001}:3001"
    volumes:
      - ../../website:/app/website
      - website_node_modules:/app/website/node_modules
      - ../../graphql:/app/graphql:ro
      - cognito_config:/run/cognito:ro
    command: ["/bin/sh","-ec", "set -a; . /run/cognito/pool.env; exec yarn dev"]


volumes:
  postgres_data:
  rustfs_data:
  cargo_target:
  website_node_modules:
  cognito_data:
  cognito_config:
