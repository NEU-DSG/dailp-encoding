name: List Backups

on:
  pull_request:
jobs:
  list_backups:
    name: List backups
    runs-on: ubuntu-22.04
    environment:
      name: Development
      deployment: false
    env:
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      AWS_VPC_ID: ${{ secrets.AWS_VPC_ID }}
      AWS_SUBNET_PRIMARY: ${{ secrets.AWS_SUBNET_PRIMARY }}
      AWS_ZONE_PRIMARY: ${{ secrets.AWS_ZONE_PRIMARY }}
      AWS_SUBNET_SECONDARY0: ${{ secrets.AWS_SUBNET_SECONDARY0 }}
      AWS_ZONE_SECONDARY0: ${{ secrets.AWS_ZONE_SECONDARY0 }}
      AWS_SUBNET_SECONDARY1: ${{ secrets.AWS_SUBNET_SECONDARY1 }}
      AWS_ZONE_SECONDARY1: ${{ secrets.AWS_ZONE_SECONDARY1 }}
      AWS_SUBNET_BASTION: ${{ secrets.AWS_SUBNET_BASTION }}
      AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
      GIT_REPOSITORY_URL: https://github.com/neu-dsg/dailp-encoding
      OAUTH_TOKEN: ${{ secrets.OAUTH_TOKEN }}
      RUST_LOG: info
      TF_STAGE: dev
      BASTION_ID: ${{ secrets.DEV_EC2_INSTANCE }}
      BASTION_IP: ${{ secrets.DEV_BASTION_IP }}
      BASTION_SSH_KEY: ${{ github.workspace }}/.bastion-ssh-key.pem
      BUNDLE_ROOT: ""
      BUNDLE_DIR: ""
      BUNDLE_ZIP: ""
      ZIP_BYTES: ""
      CF_URL: ""
      BACKUP_CLOUD_PREFIX: xml-backups
      BACKUP_BUCKET: dailp-dev-media-storage
      SUMMARY_DIR: ${{ github.workspace }}/.backup-summary
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Install Nix
        uses: cachix/install-nix-action@v20
        with:
          nix_path: nixpkgs=channel:nixos-21.11
      - name: Use binary cache for nix store
        uses: cachix/cachix-action@v12
        with:
          name: dailp
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          pushFilter: "(-dailp$|-dailp-|-terraform-config$|-source$|\\.tar\\.gz$|-output$|-plan$|-apply-now$|-apply$)"
      - name: Build project
        run: |
          nix build --impure -L
          nix run --impure -L .#tf-init
      - name: Run list script
        run: ./bin/list-backup-objects
