name: Infrastructure Health Check

on:
  workflow_dispatch:
    inputs: 
      applyTo:
        required: true
        default: Development
        type: choice
        description: Which environment do you want to test against?
        options:
          - Development
          - Staging/UAT
          - Production
jobs:
  check_bastion:
    name: Check Bastion EC2
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: ${{ inputs.applyTo == 'Production' && 'Production' || 'Development'}}
      deployment: false
    env:
      DATABASE_PASSWORD:  ${{ inputs.applyTo == 'Staging/UAT' && secrets.UAT_DATABASE_PASSWORD || secrets.DATABASE_PASSWORD }}
      BASTION_ID: ${{ (inputs.applyTo == 'Staging/UAT' && secrets.UAT_EC2_INSTANCE) || (inputs.applyTo == 'Production' && secrets.EC2_INSTANCE) || secrets.DEV_EC2_INSTANCE}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Install Nix
        uses: cachix/install-nix-action@v20
        with:
          nix_path: nixpkgs=channel:nixos-21.11
      - name: Use binary cache for nix store
        uses: cachix/cachix-action@v12
        with:
          name: dailp
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          pushFilter: "(-dailp$|-dailp-|-terraform-config$|-source$|\\.tar\\.gz$|-output$|-plan$|-apply-now$|-apply$)"
      - name: Report Bastion AMI and OS Drift
        # Informational only -- never fail the health check on this. It answers
        # "is the bastion's image still current, and is it even the OS we think
        # it is?", which terraform/bastion-host.nix cannot answer on its own
        # because it pins the ami by id on purpose (a latest-pointer there would
        # let an AWS release replace the instance unattended under
        # `tf-apply-now`). The drift signal belongs here instead: this workflow
        # is workflow_dispatch-only, so a failure cannot take out a release.
        #
        # Deliberately uses only read-only EC2/SSM *API* calls from the runner,
        # not commands on the host: infra-check sets no BASTION_SSH_KEY, and
        # ssm:SendCommand is a separate permission from ssm:StartSession that
        # terraform/docs/runbook.md notes may not be granted. On-host facts
        # (bash version, disk) are covered by the Data Backup preflight.
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "::group::Running image"
          LIVE_AMI=$(aws ec2 describe-instances --instance-ids "$BASTION_ID" \
            --query 'Reservations[].Instances[].ImageId' --output text)
          echo "Instance $BASTION_ID is running $LIVE_AMI"
          aws ec2 describe-images --image-ids "$LIVE_AMI" --query \
            'Images[].{Name:Name,Arch:Architecture,Created:CreationDate,Deprecates:DeprecationTime,State:State}' \
            --output table || echo "Could not describe $LIVE_AMI -- it may have been deregistered."
          echo "::endgroup::"

          echo "::group::Latest Amazon Linux 2023 (arm64)"
          # arm64 because instance_type is t4g.micro; the *standard* AMI, not
          # al2023-ami-minimal-*, which omits the AWS CLI the backup scripts need.
          LATEST=$(aws ssm get-parameter \
            --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64 \
            --query Parameter.Value --output text 2>/dev/null) || LATEST=""
          if [ -z "$LATEST" ]; then
            echo "Could not read the AL2023 SSM parameter (ssm:GetParameter on"
            echo "/aws/service/* may not be granted to this principal). Skipping."
          elif [ "$LATEST" = "$LIVE_AMI" ]; then
            echo "Up to date: the bastion is running the current AL2023 arm64 image."
          else
            echo "Newer image available: $LATEST (running $LIVE_AMI)."
            echo "AWS deprecates each AL2023 AMI 90 days after release, so a pin left"
            echo "alone may eventually stop launching. Refreshing is an instance"
            echo "replacement, not an edit -- see terraform/docs/sops.md."
          fi
          echo "::endgroup::"
      - name: Check Database Connection Path
        run: |
          echo "Retrieving terraform outputs..."
          nix run --impure -L .#tf-init
          DATABASE_ADDRESS=$(nix run --impure .#tf-output database_address)
          echo "Connecting to bastion via SSM..."
          aws ssm start-session \
          --target ${{ env.BASTION_ID }} \
          --document-name AWS-StartPortForwardingSessionToRemoteHost \
          --parameters '{"host":[ '"\"$DATABASE_ADDRESS\""' ],"portNumber":["5432"], "localPortNumber":["5432"]}' &
          SSM_PID=$!
          echo "Waiting for tunnel on localhost:5432..."
          for i in $(seq 1 15); do
            (echo > /dev/tcp/localhost/5432) >/dev/null 2>&1 && break
            sleep 1
          done
          export DATABASE_URL=postgres://dailp:$DATABASE_PASSWORD@localhost:5432/dailp
          psql "$DATABASE_URL" -c '\l'
          kill $SSM_PID
